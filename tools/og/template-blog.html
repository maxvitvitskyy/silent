<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0a0a0b;--lime:#c6ff00}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--night)}
.p{position:relative;width:1200px;height:630px;color:#fff;font-family:'Manrope',sans-serif;overflow:hidden}
.p>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{BG_POS}}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 20%,rgba(0,0,0,.62) 52%,rgba(0,0,0,.9) 100%)}
.logo{position:absolute;right:58px;top:40px;display:flex;align-items:center;gap:12px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.55))}
.logo img{width:57px;height:57px;display:block}
.logo span{font:700 30px/1 'Unbounded',sans-serif;letter-spacing:.02em}
.logo b{color:var(--lime)}
.h{position:absolute;left:58px;top:336px;font:800 52px/1.2 'Unbounded',sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.h span{display:block;white-space:nowrap}
.sub{position:absolute;left:58px;top:466px;max-width:1084px;font:700 26px/1.35 'Manrope',sans-serif;color:rgba(255,255,255,.88)}
.sub p{margin:0}
.pills{position:absolute;left:58px;right:58px;bottom:48px;display:flex;gap:12px}
.pill{flex:1 1 auto;text-align:center;padding:16px 14px;border:2px solid var(--lime);border-radius:999px;background:rgba(10,10,11,.6);font:500 18px/1 'Unbounded',sans-serif;text-transform:uppercase;white-space:nowrap}
.pill b{color:var(--lime);font-weight:500}
{{EXTRA_CSS}}
</style></head><body><div class="p"><img src="{{BG}}"><div class="shade"></div>
<div class="logo"><img src="{{MARK}}"><span>SILENT<b>.</b></span></div>
<div class="h">{{HEADING}}</div>
<div class="sub">{{SUBTITLE}}</div>
<div class="pills">{{PILLS}}</div></div></body></html>
