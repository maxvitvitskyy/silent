<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0a0a0b;--lime:#c6ff00}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--night)}
.p{position:relative;width:1200px;height:630px;color:#fff;font-family:'Manrope',sans-serif;background:var(--night)}
.p>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{BG_POS}}}
/* Фото на всю ширину, права частина (де текст) затемнена плавним градієнтом (текст ліворуч, фото праворуч) */
.shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(10,10,11,0) 30%,rgba(10,10,11,.68) 50%,rgba(10,10,11,.8) 66%,rgba(10,10,11,.82) 100%)}
.right{position:absolute;left:58px;width:610px;top:40px;bottom:44px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px}
.logo img{width:58px;height:58px;display:block}
.logo span{font:700 32px/1 'Unbounded',sans-serif;letter-spacing:.02em}
.logo b{color:var(--lime)}
.h{font:800 57.8px/1.12 'Unbounded',sans-serif;letter-spacing:-.02em;text-transform:uppercase}
.h span{display:block;white-space:nowrap}
.h span+span{font-weight:300;font-size:26.75px;letter-spacing:-.02em;margin-top:8px}
.sub{margin-top:21px;font:700 24.6px/1.32 'Manrope',sans-serif;color:rgba(255,255,255,.9)}
.sub p{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:11px}
.pill{padding:11.8px 21.4px;border:3px solid var(--lime);border-radius:999px;font:700 15px/1 'Unbounded',sans-serif;text-transform:uppercase}
.pill b{color:var(--lime);font-weight:800}
{{EXTRA_CSS}}
</style></head><body><div class="p"><img src="{{BG}}">
<div class="shade"></div>
<div class="right"><div class="logo"><img src="{{MARK}}"><span>SILENT<b>.</b></span></div>
<div><div class="h">{{HEADING}}</div><div class="sub">{{SUBTITLE}}</div></div>
<div class="pills">{{PILLS}}</div></div>
</div></body></html>
