<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0a0a0b;--lime:#c6ff00}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--night)}
.p{position:relative;width:1200px;height:630px;color:#fff;font-family:'Manrope',sans-serif;overflow:hidden}
.p>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{BG_POS}}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.82) 100%)}
.badge{position:absolute;right:58px;top:47px;padding:9px 22px;border-radius:999px;background:var(--lime);color:#0a0a0b;font:800 27px/1 'Unbounded',sans-serif}
.h{position:absolute;left:58px;top:348px;font:800 55px/1.27 'Unbounded',sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.h span{display:block;white-space:nowrap}
.pills{position:absolute;left:58px;right:58px;bottom:56px;display:flex;gap:16px;justify-content:space-between}
.pill{padding:13px 22px;border:3px solid var(--lime);border-radius:999px;background:rgba(10,10,11,.55);font:700 18px/1 'Unbounded',sans-serif;text-transform:uppercase;white-space:nowrap}
.pill b{color:var(--lime);font-weight:700}
{{EXTRA_CSS}}
</style></head><body><div class="p"><img src="{{BG}}"><div class="shade"></div>
<div class="badge">SILENT.</div>
<div class="h">{{HEADING}}</div>
<div class="pills">{{PILLS}}</div></div></body></html>
